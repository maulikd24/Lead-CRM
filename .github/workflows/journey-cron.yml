name: Journey & SLA Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron tick
        run: |
          curl -sf -X POST "${{ secrets.CRON_TICK_URL }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
