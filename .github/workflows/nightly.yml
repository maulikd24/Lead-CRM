# Nightly (02:00 IST = 20:30 UTC) and on demand: the slow checks that would make every pull request wait.
# Same rules as ci.yml: no secret, no outbound call, a throw-away Postgres service container, EVALS_REAL_PROVIDER unset.
name: nightly
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      legacy_scale:
        description: "Synthetic legacy database scale (1 = about 0.4M rows, 10 = about 4M rows)"
        default: "10"
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CI_PGHOST: 127.0.0.1
  CI_PGPORT: "5432"
  CI_PGUSER: postgres
  AUTH_SECRET: ci-only-secret
  CRON_SECRET: ci-only-cron
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # The bigger rehearsal: a much larger synthetic legacy database upgraded with the train's migrations, plus every
  # real-database suite including the nightly-only performance suite, and the migration checks.
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run ci:migrations
      - name: Large synthetic legacy database
        run: npm run ci:legacy
        env:
          LEGACY_SCALE: ${{ inputs.legacy_scale || '10' }}
          LEGACY_BUDGET_S: "600"
      - name: Every real-database suite, including the performance suite
        run: npm run ci:db-suites -- --nightly

  # Layout budget (30 routes x phone/1440/1280) and axe on the key screens, both against the flags-on build.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
          --tmpfs /var/lib/postgresql/data
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/wt_ci_nightly
      NEXTAUTH_URL: http://127.0.0.1:3440
      AUTH_URL: http://127.0.0.1:3440
      AUTH_TRUST_HOST: "true"
      LB_BASE: http://127.0.0.1:3440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Database, seeds (roles + the layout-budget data)
        run: |
          psql -h 127.0.0.1 -U postgres -c 'create database wt_ci_nightly'
          npx prisma migrate deploy
          npm run seed:e2e
          npm run layout-budget:seed
      - run: npm run ci:build:on
      - name: Start the app
        run: |
          node scripts/ci/with-env.mjs ci/flags-all-on.env -- npx next start -p 3440 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3440/login >/dev/null && exit 0; sleep 2; done
          cat next.log; exit 1
      - name: Layout budget
        run: npm run layout-budget -- --json layout-budget.json
      - name: Accessibility (axe) on every role's key screens (fails on serious and critical)
        run: npx playwright test --project='axe-*'
        env:
          E2E_AXE: "1"
          E2E_SERVER: start
          E2E_REUSE_SERVER: "1"
          E2E_PORT: "3440"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-ui
          path: |
            layout-budget.json
            playwright-report
            test-results
            next.log
          retention-days: 7

  # Report only: dependency advisories and the deterministic agent evals.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Agent evals (deterministic judge; EVALS_REAL_PROVIDER stays unset)
        run: npm run evals
      - name: npm audit (production dependencies, high and above; report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
